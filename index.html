<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Login & Cadastro</title>
</head>

<body id="page">

    <header id="topo">
        <section class="topo">
            <img src="./img/user.jpg" alt="Imagem do Usuário" tittle="Imagem do Usuário" class="img-user">
        </section>
        <section class="menu">
            <ul class="align-link">
                <li>
                    <a href="https://api.whatsapp.com/send?phone=5511999999999" target="_blank"
                        class="link-header">WhatsApp</a>
                </li>
                <li>
                    <a href="https://www.facebook.com.br" target="_blank" class="link-header">Facebook</a>
                </li>
                <li>
                    <a href="https://www.instagram.com.br" target="_blank" class="link-header">Instagram</a>
                </li>
            </ul>
        </section>
    </header>
    <main id="container">
        <section class="box-form space">
            <div class="form-one">
                <form action="index.html" method="GET" name="formLogin" onsubmit="return ValidarCamposFormLogin();">
                    <label for="email">Digite seu E-mail:</label>
                    <input type="email" name="email" id="email" placeholder="digite aqui..." class="camp-login">
                    <label for="senha">Digite sua Senha:</label>
                    <input type="password" name="senha" id="senha" placeholder="digite aqui..." class="camp-login">
                    <button type="submit" name="btnAcessar" class="btnAcessar">Acessar</button>
                </form>
            </div>
        </section>
        <section class="box-form">
            <div class="form-two">
                <form action="index.html" method="GET" name="formCadastro" onsubmit="return ValidarCamposFormCadastro();">
                    <label for="name">Digite seu Nome:</label>
                    <input type="text" name="nome" id="name" placeholder="digite aqui..." class="camp-cadastro">
                    <label for="email">Digite seu E-mail:</label>
                    <input type="email" name="email" id="email" placeholder="digite aqui..." class="camp-cadastro">
                    <label for="telefone">Digite seu Telefone:</label>
                    <input type="number" name="telefone" id="telefone" placeholder="digite aqui..." class="camp-cadastro">
                    <label>Selecione sua Data de Nascimento:</label>
                    <input type="date" name="nascimento" id="nascimento" class="camp-cadastro">
                    <label>Selecione o Curso Desejado:</label>
                    <select name="curso" id="curso" class="camp-cadastro">
                        <option value="">Selecione</option>
                        <option value="0">Design Gráfico</option>
                        <option value="1">Front-End</option>
                        <option value="2">Back-End</option>
                        <option value="3">Banco de Dados</option>
                    </select>
                    <label for="senha">Digite sua senha:</label>
                    <input type="password" name="senha" id="senha" placeholder="digite aqui..." class="camp-cadastro">
                    <label for="repSenha">Confirme sua senha:</label>
                    <input type="password" name="repSenha" id="repSenha" placeholder="digite aqui..." class="camp-cadastro">
                    <label for="obs">Digite uma Observação:</label>
                    <input type="text" name="obs" id="obs" placeholder="digite aqui..." class="camp-cadastro-obs">
                    <button type="submit" name="btnCadastrar" class="btnCadastrar">Acessar</button>
                </form>
            </div>
        </section>
    </main>
    <footer id="end">
        <section>
            <div class="copy">
                <p>Todos os direitos reservados - 2025 WMBarros Treinamento em TI.</p>
            </div>
        </section>
    </footer>

    <script src="js/validar.js"></script>
</body>

</html>
